{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Calisfy Leaderboard</h1>
<div class="bg-card border border-border rounded-xl divide-y divide-border">
    {% for r in ranks %}
    <a href="{% url 'accounts:profile_detail' r.user.username %}" class="flex items-center justify-between px-4 py-3 hover:bg-bg">
        <div class="flex items-center gap-3">
            <span class="text-gray-500 w-6">#{{ forloop.counter }}</span>
            <span class="font-semibold">@{{ r.user.username }}</span>
        </div>
        <div class="text-right">
            <span class="text-gold text-sm font-bold uppercase">{{ r.current_rank.name|default:"Unranked" }}</span>
            <span class="text-xs text-gray-500 block">{{ r.cached_verified_skill_count }} verified skills</span>
        </div>
    </a>
    {% empty %}<p class="p-4 text-gray-500">No athletes ranked yet.</p>{% endfor %}
</div>
{% endblock %}
