{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-1">{{ program.name }}</h1>
<p class="text-gray-500 mb-6">{{ program.description }}</p>
<div class="space-y-3">
    {% for w in workouts %}
    <div class="bg-card border border-border rounded-xl p-4 flex justify-between items-center">
        <div>
            <div class="font-semibold">{{ w.title }}</div>
            <div class="text-xs text-gray-500">{{ w.estimated_duration_minutes }} min</div>
        </div>
        <form method="post" action="{% url 'training:start_workout' w.pk %}">{% csrf_token %}
            <button class="bg-accent px-4 py-2 rounded-lg text-sm font-semibold">Start</button>
        </form>
    </div>
    {% endfor %}
</div>
{% endblock %}
