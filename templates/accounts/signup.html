{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto bg-card border border-border rounded-xl p-6 mt-8">
    <h1 class="text-xl font-bold mb-4">Create your Calisfy account</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="text-sm text-gray-400">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<p class="text-xs text-accent">{{ error }}</p>{% endfor %}
        </div>
        {% endfor %}
        <button class="w-full bg-accent py-2 rounded-lg font-semibold mt-2">Sign Up</button>
    </form>
    <p class="text-sm text-gray-500 mt-4">Already have an account? <a href="{% url 'accounts:login' %}" class="text-accent">Log in</a></p>
</div>
{% endblock %}
