{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto bg-card border border-border rounded-xl p-6 mt-8">
    <h1 class="text-xl font-bold mb-4">Log in to Calisfy</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="text-sm text-gray-400">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<p class="text-xs text-accent">{{ error }}</p>{% endfor %}
        </div>
        {% endfor %}
        <label class="flex items-center gap-2 text-sm text-gray-400 mb-3">
            <input type="checkbox" name="remember_me"> Remember me
        </label>
        <button class="w-full bg-accent py-2 rounded-lg font-semibold">Log In</button>
    </form>
    <p class="text-sm text-gray-500 mt-4">
        <a href="{% url 'accounts:password_reset' %}" class="text-accent">Forgot password?</a> ·
        <a href="{% url 'accounts:signup' %}" class="text-accent">Sign up</a>
    </p>
</div>
{% endblock %}
