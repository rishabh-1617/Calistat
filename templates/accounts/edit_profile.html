{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-card border border-border rounded-xl p-6 mt-8">
    <h1 class="text-xl font-bold mb-4">Edit Profile</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="text-sm text-gray-400">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
        <button class="w-full bg-accent py-2 rounded-lg font-semibold">Save</button>
    </form>
</div>
{% endblock %}
