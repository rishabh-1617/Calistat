{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto bg-card border border-border rounded-xl p-6 mt-8">
    {% if form %}
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="w-full bg-accent py-2 rounded-lg font-semibold mt-2">Submit</button></form>
    {% else %}
    <p>Check your email for further instructions.</p>
    {% endif %}
</div>
{% endblock %}
